<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>PureAthletic browser smoke test</title>
  </head>
  <body>
    <pre id="result">RUNNING</pre>
    <iframe id="site" src="/" hidden></iframe>
    <script>
      const result = document.querySelector("#result");
      const frame = document.querySelector("#site");

      const wait = (milliseconds) =>
        new Promise((resolve) => setTimeout(resolve, milliseconds));

      async function waitFor(predicate, message, attempts = 80) {
        for (let index = 0; index < attempts; index += 1) {
          const value = predicate();
          if (value) return value;
          await wait(50);
        }
        throw new Error(message);
      }

      frame.addEventListener("load", async () => {
        try {
          const page = frame.contentDocument;
          frame.contentWindow.localStorage.clear();

          const favicon = page.querySelector('link[rel="icon"]');
          if (favicon?.getAttribute("href") !== "/favicon.svg") {
            throw new Error("The PureAthletic favicon is missing");
          }

          const researchNotice = page.querySelector(
            '.research-notice[aria-labelledby="research-notice-title"]'
          );
          if (!researchNotice
              || !researchNotice.textContent.includes("Adult research prototype")
              || !researchNotice.textContent.includes("Use fictional profiles only")
              || !researchNotice.textContent.includes("training or medical advice")) {
            throw new Error("The landing-page research boundary is missing");
          }

          const click = (selector) => {
            const control = page.querySelector(selector);
            if (!control) throw new Error(`Missing control: ${selector}`);
            control.click();
          };
          const setValue = (control, value) => {
            if (!control) throw new Error("Missing input control");
            control.value = value;
            control.dispatchEvent(new Event("input", { bubbles: true }));
            control.dispatchEvent(new Event("change", { bubbles: true }));
          };
          const input = (selector, value) => {
            const control = page.querySelector(selector);
            if (!control) throw new Error(`Missing input: ${selector}`);
            setValue(control, value);
          };

          click('[data-action="start-onboarding"]');
          await waitFor(
            () => page.querySelector('[data-field="guardianConfirmed"]'),
            "Guardian approval step did not open"
          );
          click('[data-field="guardianConfirmed"]');
          click('[data-field="disclaimerAccepted"]');
          click('[data-action="onboarding-next"]');

          await waitFor(
            () => page.querySelector("#age-band"),
            "Football profile step did not open"
          );
          const preferredName = page.querySelector("#name");
          if (!preferredName.required || !page.querySelector('label[for="name"] .required-marker')) {
            throw new Error("Preferred name is missing required-field treatment");
          }
          const ageBand = page.querySelector("#age-band");
          if (ageBand.options[0].textContent !== "Select a range" || !ageBand.options[0].disabled) {
            throw new Error("Age-band prompt is missing");
          }
          if (!page.querySelector('[data-action="onboarding-next"]').disabled) {
            throw new Error("Age-band selection must be required");
          }
          const ageBandLabels = [...ageBand.options]
            .filter((option) => !option.disabled)
            .map((option) => option.textContent);
          if (ageBandLabels.join("|") !== "U5–U8|U9–U12|U13–U15|U16–U17") {
            throw new Error("Developmental age-band choices are incorrect");
          }
          input("#age-band", "u9-u12");
          if (!page.querySelector('[data-action="onboarding-next"]').disabled) {
            throw new Error("Preferred name must be required before continuing");
          }
          input("#name", "   ");
          if (!page.querySelector('[data-action="onboarding-next"]').disabled) {
            throw new Error("Whitespace-only preferred name was accepted");
          }
          input("#name", "Alex");
          if (page.querySelector('[data-action="onboarding-next"]').disabled) {
            throw new Error("Valid name and age-band selection did not enable Continue");
          }

          const advanced = page.querySelector(".choice-unavailable");
          if (!advanced?.disabled || advanced.dataset.action) {
            throw new Error("Advanced must be disabled and have no action");
          }

          click('[data-action="set-experience"][data-value="Intermediate"]');
          click('[data-action="onboarding-next"]');
          await waitFor(
            () => page.querySelector('[data-action="set-goal"][data-value="Speed"]'),
            "Goal step did not open"
          );
          click('[data-action="set-goal"][data-value="Speed"]');
          click('[data-action="onboarding-next"]');

          await waitFor(
            () => page.querySelector('[data-action="remove-commitment"]'),
            "Commitment step did not open"
          );
          if (page.querySelectorAll('[data-action="remove-commitment"]').length !== 2) {
            throw new Error("The default practice and match are missing");
          }

          click('[data-action="add-commitment"][data-commitment-type="practice"]');
          click('[data-action="add-commitment"][data-commitment-type="match"]');
          if (page.querySelectorAll('[data-action="remove-commitment"]').length !== 4) {
            throw new Error("Multiple practices and matches were not added");
          }

          while (page.querySelector('[data-action="remove-commitment"]')) {
            page.querySelector('[data-action="remove-commitment"]').click();
          }
          if (page.querySelectorAll('[data-action="add-commitment"]').length !== 2) {
            throw new Error("An empty schedule should keep both add actions available");
          }
          if (page.querySelector('[data-action="onboarding-next"]').disabled) {
            throw new Error("An empty commitment list should be optional");
          }
          if (page.body.textContent.includes("Days available for optional training")
              || page.body.textContent.includes("Equipment available for optional training")
              || page.body.textContent.includes("A qualified coach can supervise optional sessions")
              || page.querySelector('[data-field="qualifiedSupervisionAvailable"]')) {
            throw new Error("Deferred planner inputs should not appear on onboarding Step 4");
          }

          click('[data-action="onboarding-next"]');
          await waitFor(
            () => page.body.textContent.includes("No fixed commitments"),
            "Review did not show an empty commitment state"
          );
          click('[data-action="onboarding-back"]');
          await waitFor(
            () => page.querySelector('[data-action="add-commitment"]'),
            "Commitment step did not reopen"
          );
          click('[data-action="add-commitment"][data-commitment-type="practice"]');
          click('[data-action="add-commitment"][data-commitment-type="practice"]');
          click('[data-action="add-commitment"][data-commitment-type="match"]');
          if (page.querySelectorAll('[data-action="remove-commitment"]').length !== 3) {
            throw new Error("Unlimited commitment list did not preserve three entries");
          }
          const matchCard = page.querySelector('[data-action="remove-commitment"][data-commitment-type="match"]')?.closest(".schedule-card");
          setValue(matchCard?.querySelector('[data-field="day"]'), "Sunday");
          setValue(matchCard?.querySelector('[data-field="time"]'), "17:30");
          click('[data-action="onboarding-next"]');
          click('[data-action="onboarding-next"]');

          await waitFor(
            () => page.body.textContent.includes("React, accelerate and stop"),
            "U9–U12 Intermediate Speed recommendation was not selected",
            160
          );

          const savedProfile = JSON.parse(
            frame.contentWindow.localStorage.getItem("pureathletic-prototype-v2")
          );
          if (savedProfile.user.ageBandId !== "u9-u12" || "ageGroup" in savedProfile.user) {
            throw new Error("Profile did not save the selected age band cleanly");
          }
          if (savedProfile.user.name !== "Alex" || savedProfile.schedule.commitments.length !== 3) {
            throw new Error("Name or unlimited commitments were not saved cleanly");
          }
          const deferredPlannerFields = [
            "canonicalPlan",
            "routineRecommendation",
            "plannerVersions",
            "canonicalPlanNeedsRefresh"
          ];
          if (deferredPlannerFields.some((field) => field in savedProfile)
              || "qualifiedSupervisionAvailable" in savedProfile.user) {
            throw new Error("Deferred planner data was saved with the profile");
          }
          const optionalPlan = savedProfile.plan.filter((item) => !item.fixed);
          if (!optionalPlan.some((item) => ["Planned", "Recovery"].includes(item.status))
              || optionalPlan.every((item) => item.title === "Open day")) {
            throw new Error("Generated Training plan incorrectly fell back to all open days");
          }
          const savedMatch = savedProfile.schedule.commitments.find((commitment) => commitment.type === "match");
          if (savedMatch?.day !== "Sunday" || savedMatch.time !== "17:30") {
            throw new Error("A commitment's own day and time were not saved");
          }

          if (frame.contentWindow.location.pathname !== "/today") {
            throw new Error("Today does not have its own URL");
          }
          const expectedTodayHeading = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Bangkok",
            weekday: "long",
            day: "numeric",
            month: "long"
          }).format(new Date()).toUpperCase();
          if (page.querySelector(".screen-eyebrow")?.textContent !== expectedTodayHeading) {
            throw new Error("Today does not use the live GMT+7 calendar date");
          }

          const routeLinks = [...page.querySelectorAll('.side-nav [data-action="navigate"]')]
            .map((link) => link.getAttribute("href"));
          if (routeLinks.join("|") !== "/today|/training|/progress|/profile") {
            throw new Error("Primary navigation routes are incorrect");
          }

          click('.side-nav [data-action="navigate"][data-screen="progress"]');
          await waitFor(
            () => frame.contentWindow.location.pathname === "/progress",
            "Progress route did not open"
          );
          if (!page.body.textContent.includes("Your first review is taking shape.")
              || page.body.textContent.includes("53")) {
            throw new Error("A customized profile started with seeded progress data");
          }

          click('.side-nav [data-action="navigate"][data-screen="week"]');
          await waitFor(
            () => frame.contentWindow.location.pathname === "/training",
            "Training route did not open"
          );
          if (page.querySelectorAll('a.plan-row[data-action="open-training-detail"]').length !== 8) {
            throw new Error("The plan did not include both same-day practices");
          }
          if (page.querySelectorAll('a.plan-row[data-action="open-training-detail"] .pill-dark').length !== 3) {
            throw new Error("The plan did not preserve all three fixed commitments");
          }
          const todaySessionRow = [...page.querySelectorAll('a.plan-row[data-action="open-training-detail"]')]
            .find((row) => row.querySelector(".plan-day")?.textContent.startsWith("TODAY ·")
              && !row.querySelector(".pill-dark"));
          if (todaySessionRow) {
            todaySessionRow.click();
            await waitFor(
              () => frame.contentWindow.location.pathname === "/check-in"
                && page.querySelector("main h1")?.textContent === "How ready do you feel?",
              "Today's Training session did not require check-in"
            );
            click('[data-action="submit-checkin"]');
            await waitFor(
              () => frame.contentWindow.location.pathname === "/check-in/result",
              "Check-in result did not open from Training"
            );
            click('[data-action="continue-outcome"]');
            await waitFor(
              () => frame.contentWindow.location.pathname === "/training/workout",
              "Today's workout did not open after check-in"
            );
            click('[data-action="open-planned-log"][data-status="Modified"]');
            await waitFor(
              () => page.querySelector('[data-form="activity-log"]'),
              "Modified-session log did not open"
            );
            page.querySelector('[data-form="activity-log"]').requestSubmit();
            await waitFor(
              () => frame.contentWindow.location.pathname === "/today"
                && page.querySelector(".recommendation-card.completed-card"),
              "Today did not show the logged-session completion state"
            );
            click('.side-nav [data-action="navigate"][data-screen="week"]');
            await waitFor(
              () => frame.contentWindow.location.pathname === "/training",
              "Training did not reopen after logging today's session"
            );
            const completedTodayRow = [...page.querySelectorAll(".plan-row.completed")]
              .find((row) => row.querySelector(".plan-day")?.textContent.startsWith("TODAY ·"));
            if (!completedTodayRow
                || completedTodayRow.matches("a")
                || !completedTodayRow.textContent.includes("MODIFIED")
                || !completedTodayRow.textContent.includes("Logged")) {
              throw new Error("Today's logged Training row is not clearly completed and locked");
            }
          }
          const plannedMatch = [...page.querySelectorAll('a.plan-row[data-action="open-training-detail"]')]
            .find((row) => row.querySelector(".pill-dark")?.textContent === "MATCH");
          if (!/^SUN \d{1,2} · FIXED$/.test(plannedMatch?.querySelector(".plan-day")?.textContent || "")
              || !plannedMatch.textContent.includes("17:30")) {
            throw new Error("The plan did not use the edited match day and time");
          }
          const fixedCommitmentRow = [...page.querySelectorAll('a.plan-row[data-action="open-training-detail"]')]
            .find((row) => row.querySelector(".pill-dark")?.textContent === "TEAM PRACTICE");
          const fixedCommitmentId = fixedCommitmentRow?.dataset.id;
          fixedCommitmentRow?.click();
          await waitFor(
            () => frame.contentWindow.location.pathname === `/training/session/${fixedCommitmentId}`
              && page.querySelector("main h1")?.textContent === "Team training",
            "A generated commitment detail did not open"
          );
          click('[data-action="back-training"]');
          await waitFor(
            () => frame.contentWindow.location.pathname === "/training",
            "Generated commitment Back did not restore Training"
          );
          const recoveryRow = [...page.querySelectorAll('[data-action="open-training-detail"]')]
            .find((row) => row.querySelector(".day-dot.recovery"));
          const recoveryId = recoveryRow?.dataset.id;
          const recoveryTitle = recoveryRow?.querySelector(".plan-main strong")?.textContent;
          recoveryRow?.click();
          await waitFor(
            () => frame.contentWindow.location.pathname === `/training/session/${recoveryId}`
              && page.querySelector("main h1")?.textContent === recoveryTitle,
            "Recovery detail did not open"
          );
          click('[data-action="back-training"]');
          await waitFor(
            () => frame.contentWindow.location.pathname === "/training",
            "Recovery Back did not restore Training"
          );
          const plannedRow = [...page.querySelectorAll('[data-action="open-training-detail"]')]
            .find((row) => !row.querySelector(".plan-day")?.textContent.startsWith("TODAY ·")
              && row.querySelector(".pill-neutral")?.textContent === "PLANNED");
          const plannedId = plannedRow?.dataset.id;
          const plannedTitle = plannedRow?.querySelector(".plan-main strong")?.textContent;
          plannedRow?.click();
          await waitFor(
            () => frame.contentWindow.location.pathname === `/training/session/${plannedId}`
              && page.querySelector("main h1")?.textContent === plannedTitle,
            "Planned-session detail did not open"
          );
          click('[data-action="back-training"]');
          await waitFor(
            () => frame.contentWindow.location.pathname === "/training",
            "Planned-session Back did not restore Training"
          );
          if (page.querySelector(".plan-row:not([href])")) {
            throw new Error("A training row is missing its URL");
          }
          frame.contentWindow.history.back();
          await waitFor(
            () => frame.contentWindow.location.pathname === "/today",
            "Browser Back did not restore Today"
          );

          click('[data-action="open-unplanned-log"]');
          await waitFor(
            () => page.querySelector('[data-form="activity-log"]'),
            "Activity log did not open"
          );
          input("#log-duration", "0");
          page.querySelector('[data-form="activity-log"]').requestSubmit();
          if (frame.contentWindow.location.pathname !== "/activity/log" || page.querySelector("#log-duration").checkValidity()) {
            throw new Error("Invalid activity duration was accepted");
          }
          click('[data-action="back-today"]');
          await waitFor(
            () => frame.contentWindow.location.pathname === "/today",
            "Activity log Back did not restore Today"
          );

          click('.side-nav [data-action="navigate"][data-screen="profile"]');
          await waitFor(
            () => frame.contentWindow.location.pathname === "/profile"
              && page.querySelector('[data-action="toggle-notifications"]'),
            "Profile did not open"
          );
          const reminderToggle = page.querySelector('[data-action="toggle-notifications"]');
          const previousReminderState = reminderToggle.getAttribute("aria-checked");
          reminderToggle.click();
          const savedAfterPreferenceChange = JSON.parse(
            frame.contentWindow.localStorage.getItem("pureathletic-prototype-v2")
          );
          if (savedAfterPreferenceChange.preferences?.notifications === (previousReminderState === "true")) {
            throw new Error("Reminder preference was not persisted");
          }

          result.textContent =
            "PASS: onboarding, routes, history, week actions, validation, and responsive state";
        } catch (error) {
          result.textContent = `FAIL: ${error.message}`;
        }
      }, { once: true });
    </script>
  </body>
</html>
