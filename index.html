<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14211d">
    <meta
      name="description"
      content="Adult-only research prototype for evaluating age-aware football planning with fictional profiles."
    >
    <title>PureAthletic</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>

  <body>
    <div id="app"></div>
    <template id="landing-view">
      <main class="landing">
        <header class="landing-header">
          <div class="brand">
            <span class="brand-mark" data-icon="bolt"></span>
            <span>PureAthletic</span>
          </div>
          <button class="text-button" type="button" data-action="enter-demo">
            Explore demo
          </button>
        </header>

        <section class="hero">
          <div class="hero-copy">
            <span class="pill pill-lime">Built around your football week</span>
            <h1>Train for what<br>comes next.</h1>
            <p>
              Explore how an age-aware plan could adapt to a fictional player’s
              goal, football schedule, experience, and readiness.
            </p>
            <aside class="research-notice" aria-labelledby="research-notice-title">
              <strong id="research-notice-title">Adult research prototype</strong>
              <span>
                Use fictional profiles only. Do not follow its workouts as
                training or medical advice.
              </span>
            </aside>
            <div class="hero-actions">
              <button class="button button-primary" type="button" data-action="start-onboarding">
                <span>Try guided setup <span aria-hidden="true">→</span></span>
              </button>
              <button class="button button-secondary" type="button" data-action="enter-demo">
                <span>View seeded demo</span>
              </button>
            </div>
            <div class="trust-row">
              <span><i data-icon="check"></i> Practices &amp; matches stay fixed</span>
              <span><i data-icon="check"></i> Every change is explained</span>
            </div>
          </div>

          <div class="hero-preview" aria-label="Preview of today's recommendation">
            <div class="preview-top"><span>Today</span><span data-current-date>Current date</span></div>
            <div class="preview-card">
              <span class="eyebrow">TODAY’S RECOMMENDATION</span>
              <div class="preview-icon" data-icon="bolt"></div>
              <span class="pill pill-lime">Technical</span>
              <h2>Match confidence<br>touches</h2>
              <p>20 min · Easy</p>
              <div class="preview-button">Complete check-in</div>
            </div>
            <div class="preview-next">
              <span class="eyebrow">UP NEXT</span>
              <strong data-next-commitment-title>Team practice</strong>
              <span data-next-commitment-time>Thursday · 19:00</span>
            </div>
          </div>
        </section>

        <footer class="landing-footer">
          <span>For controlled evaluation by adults.</span>
          <span>Research prototype · No training or medical advice</span>
        </footer>
      </main>
    </template>

    <noscript>
      <p class="javascript-notice">
        PureAthletic needs JavaScript enabled for its interactive training planner.
      </p>
    </noscript>
  </body>
</html>
